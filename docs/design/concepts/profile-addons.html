<style>

   as there are. Left: the profiles, filtered and ticked. Right: what the ticked ones have — one profile is a list
   with a switch a row; several, or all, is a list of add-ons each saying in how many it is, opening to the profiles
   themselves. Install MCP… takes the agent's own command and the profiles to run it in. A server is switched off or
   removed in one profile, in the ticked ones, or everywhere.

  color-scheme: dark;

<body>
<div class="ctl">
  <span style="font:12px var(--mono);color:#77736c">Profiles</span>
  <button data-count="4">4</button><button data-count="28" class="on">28</button><button data-count="120">120</button>

</div>
<p class="note">每个配置装了什么，配置再多也能管。左边勾选配置（可搜索、可按类别一键勾选），右边显示勾中的：勾一个是带开关的清单，勾多个或不勾（全部）是按项汇总，写明在几个配置里。Install MCP… 输入 agent 自己的安装命令，装到指定的配置。每个 MCP 可以在单个配置、勾中的配置或全部配置里停用和删除。顶上的 4 / 28 / 120 切换配置数量。数据是示例，只存在这个页面里。</p>
<div class="stage"><div class="set" id="set"></div></div>
<script>
const NAMES = ["work", "lab", "relay", "client-acme", "client-birch", "research", "billing", "ops", "night", "review", "sandbox", "team-a", "team-b", "eu-proxy", "us-proxy", "jp-proxy", "trial-1", "trial-2", "trial-3", "docs", "release", "infra", "mobile", "web", "data", "ml", "support", "archive"];
const COLORS = ["#7a5af8", "#3fa56b", "#b7791f", "#c2578f", "#2f9bb8", "#8a8f3a", "#c9603a", "#5b7fd6"];
const KINDS = { "Claude Code": ["MCP Servers", "Skills", "Plugins", "Agents", "Commands"], "Codex": ["MCP Servers", "Skills", "Plugins", "Prompts", "Rules"] };
const CATALOG = {
  "Claude Code": [
    ["MCP Servers", "chrome-devtools", "browser automation", { Transport: "stdio", Command: "npx chrome-devtools-mcp@latest", Environment: "—" }, .7],
    ["MCP Servers", "postgres", "local database", { Transport: "stdio", Command: "uvx mcp-postgres", Environment: "1 variable · hidden" }, .25],
    ["MCP Servers", "figma", "design files", { Transport: "http", URL: "https://mcp.example.com/figma", Headers: "1 header · hidden" }, .15],
    ["MCP Servers", "linear", "issues", { Transport: "http", URL: "https://mcp.example.com/linear", Headers: "1 header · hidden" }, .4],
    ["Skills", "pdf", "read and fill PDF files", { Files: "6" }, .8], ["Skills", "xlsx", "spreadsheets", { Files: "9" }, .3], ["Skills", "release-notes", "this repo’s release steps", { Files: "2" }, .1],
    ["Plugins", "status-hud", "status line", { Version: "1.4.2", Marketplace: "example-plugins" }, .6], ["Plugins", "document-skills", "docx, pptx, pdf, xlsx", { Version: "0.9.0", Marketplace: "example-plugins" }, .2],
    ["Agents", "reviewer", "reads a diff for bugs", { Model: "inherit", Tools: "Read, Grep, Bash" }, .35], ["Agents", "planner", "writes a plan before code", { Model: "opus", Tools: "Read, Grep" }, .15],
    ["Commands", "/ship", "test, commit, push", { Arguments: "[message]" }, .2],
  ],
  "Codex": [
    ["MCP Servers", "chrome-devtools", "browser automation", { Transport: "stdio", Command: "npx chrome-devtools-mcp@latest", Environment: "—" }, .6],
    ["MCP Servers", "linear", "issues", { Transport: "http", URL: "https://mcp.example.com/linear", Headers: "1 header · hidden" }, .3],
    ["Skills", "commit-style", "how commits are written here", { Files: "1" }, .4],
    ["Prompts", "review", "review the working tree", { Arguments: "—" }, .5], ["Rules", "no-force-push", "never push with --force", { Applies: "git push" }, .3],
  ],
};
const TOGGLED = new Set(["MCP Servers", "Plugins"]);   // what a profile can switch off without removing it
const HINT = { "Claude Code": "claude mcp add sentry -- npx -y @sentry/mcp-server", "Codex": "codex mcp add sentry -- npx -y @sentry/mcp-server" };
const rnd = (seed) => { let x = 0; for (const c of seed) x = (x * 31 + c.charCodeAt(0)) >>> 0; x ^= x << 13; x >>>= 0; x ^= x >> 17; x ^= x << 5; return ((x >>> 0) % 1000) / 1000; };

function seed(count) {
  const db = {};
  for (const agent of Object.keys(CATALOG)) {
    const n = agent === "Codex" ? Math.max(2, Math.round(count / 3)) : count;
    const profiles = [{ id: "default", name: "Default", color: null, shared: false, own: true }];
    for (let i = 0; i < n - 1; i++) {
      const base = NAMES[i % NAMES.length], name = i < NAMES.length ? base : `${base}-${Math.floor(i / NAMES.length) + 1}`;
      profiles.push({ id: `p${i}`, name, color: COLORS[i % COLORS.length], shared: rnd(agent + name + "s") < .22 });
    }
    const items = CATALOG[agent].map(([kind, name, about, info, share]) => {
      const at = {};
      for (const p of profiles) if (!p.shared && (p.id === "default" ? share > .25 : rnd(agent + name + p.id) < share)) at[p.id] = rnd(name + p.id + "off") < .12 && TOGGLED.has(kind) ? "off" : "on";
      return { kind, name, about, info, at };
    });
    db[agent] = { profiles, items };
  }
  return db;
}
let COUNT = 28, DB = seed(COUNT);
const S = { page: "addons", agent: "Claude Code", sel: new Set(["p0"]), pq: "", q: "", open: new Set(), menu: null, sheet: null, toast: null, undo: null };
const $ = (s) => document.querySelector(s);
const esc = (t) => String(t).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const A = () => DB[S.agent];
const P = (id) => A().profiles.find((p) => p.id === id);
const dot = (p) => `<span class="dot" style="background:${p.color ?? "transparent"};${p.color ? "" : "box-shadow:0 0 0 1px var(--ink3) inset"}"></span>`;
/** A profile that shares Default's has whatever Default has, in the state Default has it. */
const stateOf = (item, pid) => item.at[P(pid).shared ? "default" : pid] ?? null;
const itemOf = (key) => { const [kind, name] = key.split(/\/(.*)/s); return A().items.find((i) => i.kind === kind && i.name === name); };
const scope = () => (S.sel.size ? A().profiles.filter((p) => S.sel.has(p.id)) : A().profiles);
const own = (list) => list.filter((p) => !p.shared);
const plural = (n, w) => `${n} ${w}${n === 1 ? "" : "s"}`;

function change(text, fn) {
  const before = JSON.stringify(DB);
  fn();
  S.undo = before; S.toast = text; S.menu = null;
  clearTimeout(change.t); change.t = setTimeout(() => { S.toast = null; S.undo = null; render(); }, 7000);
}
/** `to`: "on" | "off" | null (removed), in each of `pids` that has a say of its own. */
function setState(item, pids, to, text) {
  change(text, () => {
    for (const pid of pids) { if (P(pid).shared) continue; if (to === null) delete item.at[pid]; else if (to === "on" && !(pid in item.at)) item.at[pid] = "on"; else if (pid in item.at) item.at[pid] = to; }
    if (!Object.keys(item.at).length) A().items.splice(A().items.indexOf(item), 1);
  });
}

function render() {
  const pages = ["Pairing", "Nodes", "Models", "Keys", "Agents", "Profiles", "Add-Ons", "Environment", "General", "Dispatch"];
  const side = `<div class="sd"><div class="lights"><i></i><i></i><i></i></div>` + pages.map((n) => {
    const id = n === "Add-Ons" ? "addons" : n.toLowerCase();
    return `<button class="it ${S.page === id ? "on" : ""}" data-page="${id}"><i></i>${n}</button>`;
  }).join("") + `</div>`;
  if (S.page !== "addons") {
    $("#set").innerHTML = side + `<div class="pg" style="grid-column:2 / -1;grid-template-rows:52px 1fr"><div class="head">${esc(pages.find((n) => n.toLowerCase() === S.page) ?? "")}</div><div class="blank"><div>这一页不在这个示范里。<br><button class="btn" data-page="addons" style="margin-top:8px">Back to Add-Ons</button></div></div></div>`;
    return;
  }
  const keep = document.activeElement?.id, at = document.activeElement?.selectionStart, plTop = $(".pl")?.scrollTop ?? 0, bodyTop = $("#body")?.scrollTop ?? 0, tlTop = $(".tl")?.scrollTop ?? 0;
  const sc = scope(), one = S.sel.size === 1 ? sc[0] : null;
  const title = one ? `${dot(one)} ${esc(one.name)}` : S.sel.size ? `${S.sel.size} Profiles` : `All ${A().profiles.length} Profiles`;

/** The agent's own command read for what it would add: `<agent> mcp add [flags] <name> -- <command…>`, or with a URL. */
function readCommand(text) {
  const words = text.trim().split(/\s+/);
  if (!text.trim()) return { err: "" };
  const cli = S.agent === "Codex" ? "codex" : "claude";
  if (words[0] !== cli) return { err: `要以 ${cli} mcp add 开头：这里选的是 ${S.agent} 的配置。` };
  if (words[1] !== "mcp" || words[2] !== "add") return { err: `只接受 ${cli} mcp add …` };
  let i = 3;
  const flags = [];
  while (words[i]?.startsWith("-") && words[i] !== "--") { flags.push(words[i]); i += /^(--transport|-t|--scope|-s|--env|-e|--header|-H)$/.test(words[i]) ? 2 : 1; }
  const name = words[i];
  if (!name || name === "--") return { err: "缺少服务名。" };
  if (!/^[a-z0-9][a-z0-9_-]*$/i.test(name)) return { err: "服务名只能用字母、数字、- 和 _。" };
  const rest = words.slice(i + 1), dash = rest.indexOf("--"), cmd = (dash >= 0 ? rest.slice(dash + 1) : rest).join(" ");
  if (!cmd) return { err: "缺少启动命令或地址。" };
  const http = /^https?:\/\//.test(cmd), secrets = (text.match(/(--env|-e|--header|-H)\s/g) ?? []).length;
  return { name, cmd, http, secrets };
}

  else if (d.from) { S.sheet.from = d.from; S.sheet.picked.clear(); S.sheet.targets.delete(d.from); }
  else if (d.pick) { S.sheet.picked.has(d.pick) ? S.sheet.picked.delete(d.pick) : S.sheet.picked.add(d.pick); }
  else if ("docopy" in d) {
    const s = S.sheet, keys = [...s.picked], to = [...s.targets], src = s.from;
    S.sheet = null;
    change(`Copied ${plural(keys.length, "item")} to ${plural(to.length, "profile")}`, () => keys.forEach((k) => { const item = itemOf(k); to.forEach((pid) => { if (!(pid in item.at)) item.at[pid] = stateOf(item, src) ?? "on"; }); }));
  }
  else if ("doinstall" in d) return install();
  else if ("undo" in d) { if (S.undo) DB = JSON.parse(S.undo); S.undo = null; S.toast = "Undone"; }
  render();
});

/** The command run once under each ticked profile, one after the other: the list says how far it is. */
function install() {
  const s = S.sheet, r = readCommand(s.text), before = JSON.stringify(DB);
  let item = A().items.find((i) => i.kind === "MCP Servers" && i.name === r.name);
  const order = A().profiles.filter((p) => s.targets.has(p.id)).map((p) => p.id);
  s.running = true; s.progress = {}; s.installed = 0; s.skipped = 0;
  render();
  const step = (n) => {
    if (S.sheet !== s) return;
    if (n >= order.length) { s.running = false; s.done = true; S.undo = before; S.toast = `Installed ${r.name} in ${plural(s.installed, "profile")}`; S.open.add(`MCP Servers/${r.name}`); return render(); }
    const pid = order[n];
    if (item?.at[pid]) { s.progress[pid] = "skip"; s.skipped += 1; render(); return step(n + 1); }
    s.progress[pid] = "run"; render();
    setTimeout(() => {
      if (!item) { item = { kind: "MCP Servers", name: r.name, about: "installed here", info: r.http ? { Transport: "http", URL: r.cmd, Headers: r.secrets ? `${plural(r.secrets, "header")} · hidden` : "—" } : { Transport: "stdio", Command: r.cmd, Environment: r.secrets ? `${plural(r.secrets, "variable")} · hidden` : "—" }, at: {} }; A().items.unshift(item); }
      item.at[pid] = "on"; s.progress[pid] = "ok"; s.installed += 1; render(); step(n + 1);
    }, order.length > 30 ? 25 : 160);
  };
  step(0);
}
render();
</script>
