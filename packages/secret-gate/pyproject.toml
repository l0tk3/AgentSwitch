[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "secret-gate"
version = "0.1.0"
description = "Local secret gate: agents handle ciphertext tokens, the gate decrypts and acts, plaintext never reaches the model"
requires-python = ">=3.11"
dependencies = [
    "pynacl>=1.5",
    "httpx>=0.27",
    "mitmproxy>=10",
    "mcp>=1.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "respx>=0.21"]

[project.scripts]
secret-gate = "secret_gate.cli:main"

[tool.setuptools.packages.find]
include = ["secret_gate*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=secret_gate --cov-report=term-missing --cov-fail-under=80"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
omit = ["secret_gate/mitm_entry.py", "secret_gate/mcp_server.py"]
