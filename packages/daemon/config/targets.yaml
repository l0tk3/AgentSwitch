# Routing catalog. One entry per harness listing every selectable model.
# `cost` / `strengths` are prose for the router; `quota`, `max_concurrent`, `browser`,
# `models` keys and `efforts` are enforced in code (src/router/validate.ts).
harnesses:
  claude-code:
    quota: local-count
    max_concurrent: 1
    browser: true
    default_model: claude-sonnet-4-6
    # Never used, even when model discovery lists them (2026-09-24, user's call: Sonnet 5's safety classifier
    # flagged plain logins; everything that was Sonnet 5 is Sonnet 4.6).
    exclude: [claude-sonnet-5, "claude-sonnet-5[1m]"]
    models:                          # "[1m]" = Claude Code's 1M-context variant of the same model
      claude-fable-5-1:          {cost: top,  strengths: [hardest, longest-agentic, architecture]}
      claude-fable-5-1[1m]:      {cost: top,  strengths: [hardest, whole-repo-context]}
      # preferred: the user's most trusted models (2026-09-24); the router gives them real work (router-v0 §5)
      claude-opus-5-5:           {cost: high, strengths: [complex-code, refactor, review], preferred: true}
      claude-opus-5-5[1m]:       {cost: high, strengths: [complex-code, whole-repo-context], preferred: true}
      claude-opus-5:             {cost: high, strengths: [complex-code, refactor], preferred: true}
      claude-opus-5[1m]:         {cost: high, strengths: [complex-code, whole-repo-context], preferred: true}
      claude-opus-4-8:           {cost: high, strengths: [complex-code]}
      claude-opus-4-8[1m]:       {cost: high, strengths: [complex-code, whole-repo-context]}
      claude-opus-4-7:           {cost: high, strengths: [complex-code]}
      claude-opus-4-7[1m]:       {cost: high, strengths: [complex-code, whole-repo-context]}
      claude-opus-4-6:           {cost: high, strengths: [complex-code]}
      claude-opus-4-6[1m]:       {cost: high, strengths: [complex-code, whole-repo-context]}
      claude-sonnet-4-6:         {cost: mid,  strengths: [code, browser, general]}
      claude-sonnet-4-6[1m]:     {cost: mid,  strengths: [code, whole-repo-context]}
      claude-haiku-4-5-20251001: {cost: low,  strengths: [small-edit, quick-answer]}
  codex:
    quota: rate-limits
    max_concurrent: 1
    browser: true
    default_model: gpt-6-astra
    binary: /Applications/ChatGPT.app/Contents/Resources/codex-cli/bin/codex   # ChatGPT.app bundle (0.158); homebrew 0.142 only knows gpt-5.5
    models:                          # app-server model/list, 2026-09-20
      gpt-6-astra:   {cost: top,  strengths: [complex-code, large-repo, test-heavy], efforts: [low, medium, high, xhigh, max, ultra], preferred: true}
      gpt-6-sol:     {cost: high, strengths: [complex-code, code, general],          efforts: [low, medium, high, xhigh, max, ultra], preferred: true}
      gpt-6-luna:    {cost: mid,  strengths: [code, general],                        efforts: [low, medium, high, xhigh, max], preferred: true}
      gpt-5.6-sol:   {cost: high, strengths: [code, general],                        efforts: [low, medium, high, xhigh, max, ultra]}
      gpt-5.6-terra: {cost: high, strengths: [code, general],                        efforts: [low, medium, high, xhigh, max, ultra]}
      gpt-5.6-luna:  {cost: mid,  strengths: [code, general],                        efforts: [low, medium, high, xhigh, max]}
      gpt-5.5:       {cost: mid,  strengths: [code, shell],                          efforts: [low, medium, high, xhigh]}
  opencode:
    quota: balance
    max_concurrent: 2
    browser: false
    default_model: deepseek/deepseek-flash
    models:                          # models.dev: deepseek-flash = "DeepSeek V4.1 Flash", 1M ctx
      deepseek/deepseek-flash: {cost: low, strengths: [chat, summarize, long-context, cheap-code]}

# Task categories with a restricted target list. The router is told about them and must set
# `category`; the code floor also detects them from `keywords` (case-insensitive substrings) and
# rejects any model outside `allow`, including fallbacks and re-dispatch after a refusal. `allow` is a
# preference order for the default policy: first entry whose harness still has quota. ASCII keywords
# match whole words only ("rop" does not match "drop"); CJK keywords match as substrings.
categories:
  security:
    description: >-
      offensive/defensive security work on the user's own targets: CTF challenges, pwn and reverse
      engineering, exploit development, vulnerability research, pentest lab work, malware analysis
    keywords:
      - "ctf"
      - "pwn"
      - "exploit"
      - "shellcode"
      - "rop"
      - "漏洞"
      - "逆向"
      - "渗透"
      - "提权"
      - "payload"
      - "webshell"
      - "木马"
      - "反编译"
      - "reverse engineer"
      - "vuln"
      - "vulnerability"
      - "cve-"
      - "malware"
      - "fuzz"
      - "fuzzing"
      - "sqli"
      - "xss"
      - "免杀"
      - "注入"
      - "爆破"
      - "题目附件"
    note: every other model refuses these tasks outright; never pick one, and never re-dispatch to one after a refusal
    allow:
      - {harness: claude-code, model: "claude-opus-4-8"}
      - {harness: claude-code, model: "claude-opus-4-8[1m]"}
      - {harness: claude-code, model: "claude-opus-4-7"}
      - {harness: claude-code, model: "claude-opus-4-7[1m]"}
      - {harness: claude-code, model: "claude-opus-4-6"}
      - {harness: claude-code, model: "claude-opus-4-6[1m]"}
      - {harness: opencode, model: "deepseek/deepseek-flash"}

router:
  harness: opencode
  model: deepseek/deepseek-flash
  effort: high                     # the model's thinking: DeepSeek V4.1 Flash has none | low | high | max (2026-09-29, user: raise it)
  timeout_ms: 90000                # the agent reads the repo first; a real run took 19 s, 27 s thinking at high (2026-09-29)
  planner_timeout_ms: 120000       # separate budget for planner startup and one JSON correction
  min_confidence: 0.5
  quota_threshold: 0.05
  default: {harness: opencode, model: "deepseek/deepseek-flash"}
  planner: {harness: claude-code, model: claude-opus-5-5}   # loop-v0: fallback planner; the router names one per multi-step task
