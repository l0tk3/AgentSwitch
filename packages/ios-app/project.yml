# xcodegen spec for the iPhone app. `xcodegen generate` writes AgentSwitch.xcodeproj (git-ignored).
# The pure logic lives in the local Swift package in this directory (AgentSwitchKit); the app target is SwiftUI only.
name: AgentSwitch
options:
  bundleIdPrefix: com.agentswitch
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: zh-Hans

packages:
  AgentSwitchKit:
    path: .
  # The terminals tab's screen (docs/terminal-v0.md §0: SwiftTerm on macOS and iOS, not a terminal core of our own).
  # 1.18.x: from 1.19 SwiftTerm runs a build-tool plugin of its own (build info from git) that every build would have
  # to trust; nothing here needs it.
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    minorVersion: 1.18.0

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "7"
    # The app's bundle id; the widget extension's is derived from it. scripts/install-device.sh overrides this one
    # setting (not PRODUCT_BUNDLE_IDENTIFIER, which would give the extension the app's id too).
    APP_BUNDLE_ID: com.agentswitch.ios
    # The app group the app and the widget share (the Channels widget's copy of the rooms, docs/app-v0.md §5). A free
    # personal team signing from the command line gets no group registered, so on a device it is off unless
    # USE_APP_GROUP=YES (a paid team; scripts/install-device.sh passes it on); the simulator always has it.
    APP_GROUP: group.$(APP_BUNDLE_ID)
    USE_APP_GROUP: NO
    "USE_APP_GROUP[sdk=iphonesimulator*]": YES
    APP_GROUP_YES: $(APP_GROUP)
    APP_GROUP_NO: ""
    APP_GROUP_IN_USE: $(APP_GROUP_$(USE_APP_GROUP))
    APP_ENTITLEMENTS_YES: App/AgentSwitchGroup.entitlements
    APP_ENTITLEMENTS_NO: App/AgentSwitch.entitlements
    WIDGET_ENTITLEMENTS_YES: Widgets/AgentSwitchWidgetsGroup.entitlements
    WIDGET_ENTITLEMENTS_NO: Widgets/AgentSwitchWidgets.entitlements
    # Both always share a keychain group (`$(AppIdentifierPrefix)com.agentswitch.shared`, WidgetLink): a development
    # profile allows every group under the team's prefix, so a free team signs it. The app's own group is listed
    # first in its file, so what it keeps without naming a group stays where it was.

targets:
  AgentSwitch:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: App
        excludes:
          - Info.plist
          - "*.entitlements"
          - "*.icon"
      # The app icon (docs/ui-v0.md §10): two layered Icon Composer documents the asset compiler draws from — the classic
      # one is the app's own, the pixel one its alternate (HomeIcon). ../mac-app/scripts/make-icons.swift writes them.
      # The Channels widget's views, also drawn by the app's sample screen (ChannelsWidgetDemo).
      - path: Widgets/ChannelsViews.swift
      - path: App/AppIcon.icon
        type: file
        buildPhase: resources
      - path: App/AppIconPixel.icon
        type: file
        buildPhase: resources
    dependencies:
      - package: AgentSwitchKit
        product: AgentSwitchKit
      - package: AgentSwitchKit
        product: AgentSwitchLive
      # The shaded pictures' drawing (ShadedPaint), shared with the Live Activity's views.
      - package: AgentSwitchKit
        product: AgentSwitchLiveUI
      - package: SwiftTerm
        product: SwiftTerm
      # The Live Activity's UI (assistant-v0 §4), embedded in the app.
      - target: AgentSwitchWidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        PRODUCT_NAME: AgentSwitch
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: $(APP_ENTITLEMENTS_$(USE_APP_GROUP))
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: AppIconPixel
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        # No team and no automatic signing: simulator builds are ad-hoc signed ("Sign to Run Locally").
        # For a device, set DEVELOPMENT_TEAM and CODE_SIGN_STYLE=Automatic in Xcode (see README).
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_IDENTITY: "-"
        "CODE_SIGN_IDENTITY[sdk=iphoneos*]": ""
        PROVISIONING_PROFILE_SPECIFIER: ""

  AgentSwitchWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Widgets
        excludes:
          - Info.plist
          - "*.entitlements"
    dependencies:
      - package: AgentSwitchKit
        product: AgentSwitchKit
      - package: AgentSwitchKit
        product: AgentSwitchLive
      - package: AgentSwitchKit
        product: AgentSwitchLiveUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).widgets
        PRODUCT_NAME: AgentSwitchWidgets
        INFOPLIST_FILE: Widgets/Info.plist
        CODE_SIGN_ENTITLEMENTS: $(WIDGET_ENTITLEMENTS_$(USE_APP_GROUP))
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_IDENTITY: "-"
        "CODE_SIGN_IDENTITY[sdk=iphoneos*]": ""
        PROVISIONING_PROFILE_SPECIFIER: ""

schemes:
  AgentSwitch:
    build:
      targets:
        AgentSwitch: all
    run:
      config: Debug
    test:
      config: Debug
